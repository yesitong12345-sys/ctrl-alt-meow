/* ------------------------------------------------------------------
   安全存储：页面可能被放在沙箱 iframe（sandbox 缺 allow-same-origin）里打开，
   这时访问 localStorage 会直接抛 SecurityError，导致每次 save() 都崩、整个页面不可用。
   这里先探测一次真实可用性，不可用就退回内存存储：功能照常，只是关掉页面后不保留。
   ------------------------------------------------------------------ */
const safeStore=(()=>{
  let backing=null,available=false;
  try{ const probe='__edu_probe__'; window.localStorage.setItem(probe,'1'); window.localStorage.removeItem(probe); backing=window.localStorage; available=true; }
  catch(error){ backing=new Map(); available=false; }

    available,
    getItem(key){ if(REMOTE_SERVER_PAGE&&key===KEY)return null;try{ return available?backing.getItem(key):memory.getItem(key); }catch(error){ return null; } },
    setItem(key,value){ if(REMOTE_SERVER_PAGE&&key===KEY)return;try{ available?backing.setItem(key,value):memory.setItem(key,value); }catch(error){ /* 配额或权限问题不能影响渲染 */ } },

  };

function save(){safeStore.setItem(KEY,JSON.stringify({...state,assets:[],drafts:[],rawMistakes:(state.__serverMistakes&&state.__serverMistakes.length)?state.__serverMistakes:(state.mistakes||[])}));window.__queueLocalMistakeSync?.()}function id(){return 'id'+Date.now()+Math.random().toString(16).slice(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function split(s){return String(s||'').split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean)}function fmt(s){return esc(s).replace(/\^([0-9a-z+-]+)/g,'<sup>$1</sup>').replace(/_([0-9a-z+-]+)/g,'<sub>$1</sub>').replace(/\n/g,'<br>')}function careless(s){return /\u7c97\u5fc3|\u9a6c\u864e|\u770b\u9519|\u6284\u9519|\u6f0f\u5199|\u7b26\u53f7|\u8ba1\u7b97/.test(s||'')}

function guess(name){return /math|\u6570|\u51fd|x\^|f\(/i.test(name)?'\u6570\u5b66':/eng|\u82f1|grammar/i.test(name)?'\u82f1\u8bed':/\u7269|\u7535|force/i.test(name)?'\u7269\u7406':'\u8bed\u6587'}function points(s){return {'\u6570\u5b66':['\u51fd\u6570\u5355\u8c03\u6027','\u96c6\u5408\u8fd0\u7b97'],'\u82f1\u8bed':['\u865a\u62df\u8bed\u6c14','\u5b9a\u8bed\u4ece\u53e5'],'\u7269\u7406':['\u7535\u573a','\u53d7\u529b\u5206\u6790'],'\u8bed\u6587':['\u963f\u623f\u5bab\u8d4b','\u540d\u7bc7\u540d\u53e5\u9ed8\u5199']}[s]||['\u6838\u5fc3\u77e5\u8bc6\u70b9']}

  function canonicalMistakeKey(item){
    let text=String(item?.normalizedInput||item?.question||item?.id||'').toUpperCase();
    return text
      .replace(/([A-Z])\s*[_－-]?\s*(\d)/g,'$1$2')
      .replace(/([A-Z]\d?)\s*到\s*([A-Z]\d?)(?=\s*分别)/g,'$1$2')
      .replace(/等于/g,'=')
      .replace(/六十(?=\s*度)/g,'60')
      /* 兼容语音把“AD=4，AA2=5”连读成“AD=4A，A2=5”。 */
      .replace(/(AD\s*=\s*[-+]?\d+(?:\.\d+)?)\s*A\s*[,，、]\s*A(\d)\s*=/g,'$1，AA$2=')
      .replace(/垂直于?|⊥|⟂/g,'⊥')
      .replace(/度/g,'°')
      .replace(/[\s,，、。；;：:]/g,'');
  }

  function recoverIdenticalVerifiedModels(records, schoolAuthenticated = false){
    // 只复用同一题干、同一学生已有的 verified 场景；不改题目 ID、作答或陪练进度。
    // 用题干而非 normalizedInput：旧上传的 LaTeX 包装与新录入的纯文本应同题。
    const keyOf = item => String(item?.question || '').toUpperCase()
      .replace(/\\\(|\\\)|\\\[|\\\]|\$/g,'')
      .replace(/[−－]/g,'-')
      .replace(/[\s,，、。；;：:]/g,'');
    const ownerOf = item => String(item?.user_id || item?.studentId || '');
    const verifiedByQuestion = new Map();
    for(const item of records){
      if(item?.geometryResult?.solverStatus !== 'verified' || !item.geometryResult.scene) continue;
      const key = keyOf(item);
      if(key) verifiedByQuestion.set(key, item);
    }
    return records.map(item => {
      if(item?.geometryResult?.scene) return item;
      const source = verifiedByQuestion.get(keyOf(item));
      if(!source || source.id === item.id || item.subject !== source.subject) return item;
      const imageHash = item.imageHash || item.sourceImageHash || item.originalImageHash;
      const sourceImageHash = source.imageHash || source.sourceImageHash || source.originalImageHash;
      if((imageHash || sourceImageHash) && imageHash !== sourceImageHash) return item;
      const owner = ownerOf(item), sourceOwner = ownerOf(source);
      if((owner && sourceOwner && owner !== sourceOwner) || (schoolAuthenticated && (!owner || !sourceOwner))) return item;
      return {...item, geometryResult:source.geometryResult,
        visualization:source.visualization || {renderer:'three',interactive:true,scene:source.geometryResult.scene},
        modelStatus:'verified', verificationStatus:'verified', modelRecoveredFromCaseId:source.id};
    });
  }
  /* END identical-own-model-recovery */
  /* 错题库排序（同时用于同题去重时选代表）。
     关键字段是 geometryResult.solverStatus，不是 verificationStatus：
     AI 参考模型题目的 verificationStatus 是 'ai_reference'、solverStatus 才是 'reference'，
     旧逻辑写成 verificationStatus==='verified' 就把所有参考模型题判为 0，
     再叠加"时间升序"，结果最新录入的题目全部沉到列表底部 ——
     首屏默认只渲染 12 条，用户翻不到，会以为"题目根本没写进去"。
     这里与 hasVerified3D 统一：verified 与 reference 同等优先，并让最新录入排在前面。 */
  function compareMistakeSyncPriority(left,right){
    const rank=item=>[
      ['verified','reference'].includes(item?.geometryResult?.solverStatus)&&item?.geometryResult?.scene?1:0,
      item?.modelStatus==='verified'?1:0,
      item?.completionReview?1:0,
      Number(item?.tutorLearningState?.scoreProgress?.percent||0)
    ],a=rank(left),b=rank(right);
    for(let index=0;index<a.length;index++)if(a[index]!==b[index])return b[index]-a[index];
    /* 时间降序：越新越靠前 */
    return (Date.parse(right?.updatedAt||right?.createdAt||0)||0)-(Date.parse(left?.updatedAt||left?.createdAt||0)||0);
  }
  async function hydrateServerMistakes(){
    if(window.__serverMistakesHydrated)return;
    window.__serverMistakesHydrated=true;
    try{
      let remote=await request('/v1/mistake-cases');
      if(!Array.isArray(remote))return;
      const deletedResponse=await request('/v1/mistake-cases/deleted-ids');
      window.__serverDeletedMistakeIds=new Set(Array.isArray(deletedResponse?.ids)?deletedResponse.ids:[]);
      window.__serverMistakeIds=new Set(remote.filter(item=>item&&item.id).map(item=>item.id));
      const currentLocal=(state.mistakes||[]).filter(item=>item&&item.origin!=='configured_example_upload'&&item.origin!=='demo_seed'&&!window.__serverDeletedMistakeIds.has(item.id));      let localById=new Map(currentLocal.map(item=>[item.id,item])),added=0;
      for(const remoteCase of remote.filter(item=>item&&item.id&&item.question&&item.origin!=='configured_example_upload')){
        let local=localById.get(remoteCase.id),normalized=reviewedMistake({...remoteCase,source:'server_verified'});
        /* 合并优先级：3D 模型、验证状态、题目本体一律以服务端为准。
           旧逻辑是 {...normalized,...local}，本地旧记录会把服务端的新 3D 模型盖掉 ——
           表现就是"题目还在，但模型没了 / 不能旋转"。只有纯本地学习进度才保留本地值。 */
        const remoteHasModel=Boolean(remoteCase.geometryResult&&remoteCase.geometryResult.scene);
        const localHasModel=Boolean(local&&local.geometryResult&&local.geometryResult.scene);
        const preferRemoteModel=remoteHasModel||!localHasModel;
        /* 合并规则：服务端的 3D 模型、验证状态、答案、题目本体一律优先；
           本地只保留学习进度。旧逻辑 {...normalized,...local} 会让本地旧记录
           盖掉服务端新模型，表现为"题目还在但模型没了"。 */
        let merged={...normalized,...local,
          question:remoteCase.question,
          studentAnswer:remoteCase.studentAnswer||local?.studentAnswer,
          correctAnswer:remoteCase.correctAnswer||local?.correctAnswer,
          correctAnswerLatex:remoteCase.correctAnswerLatex||local?.correctAnswerLatex,
          answerNotice:remoteCase.answerNotice||local?.answerNotice,
          queryAnswers:remoteCase.queryAnswers||local?.queryAnswers,
          unit:remoteCase.unit||local?.unit,
          knowledgePoints:remoteCase.knowledgePoints||local?.knowledgePoints,
          verificationStatus:remoteCase.verificationStatus||local?.verificationStatus,
          modelStatus:remoteCase.modelStatus||local?.modelStatus,
          problemSpec:remoteCase.problemSpec||local?.problemSpec,
          geometryResult:remoteCase.geometryResult||local?.geometryResult,
          geometryCompilation:remoteCase.geometryCompilation||null,
          aiRubric:remoteCase.aiRubric||null,
          aiStepsStatus:remoteCase.aiStepsStatus||'not_requested',
          visualization:remoteCase.visualization||local?.visualization,
          tutorLearningState:remoteCase.tutorLearningState||local?.tutorLearningState,
          completionReview:remoteCase.completionReview||local?.completionReview,
          learningProfile:local?.learningProfile||{mastery:remoteCase.tutorLearningState?.scoreProgress?.percent===100?58:36,confidence:3,bottleneck:'线面角的微技能仍需迁移验证',interval:0,dueAt:dayStamp(),reviews:0,lastResult:'已完成原题，待迁移验证'}};
        // 服务端这次没有模型、但本地有：保留本地模型，避免刷新后凭空丢失可旋转画布。
        if(!remoteHasModel&&localHasModel){merged.geometryResult=local.geometryResult;merged.visualization=local.visualization;}
        if(!local)added++;
        localById.set(merged.id,merged);
      }
      // 合并 hydration 期间新提交的本地记录，避免旧 GET 响应覆盖刚入库题目。
      for(const local of (state.mistakes||[]).filter(item=>item&&item.origin!=='configured_example_upload'&&item.origin!=='demo_seed'&&!window.__serverDeletedMistakeIds.has(item.id)))if(!localById.has(local.id))localById.set(local.id,local);
      /* 在去重之前保存服务端全量列表：
         错题库默认按题干合并显示，用户会以为旧题被删；
         保留全量列表才能提供"显示全部提交"开关。 */
      state.__serverMistakes=[...localById.values()];
      state.__rawMistakesSnapshot=state.__serverMistakes;
      /* ------------------------------------------------------------------
         去重不再"删除"任何题目
         旧实现把同一题干的记录直接丢弃，只保留优先级最高的一条：
         用户看到的就是"我上传的错题怎么没了"。这些记录服务端都还在，
         但本地存的是去重后的列表，一旦服务端没连上就真的看不见了。
         这里改成：保留的条目上记录被合并的 id（mergedIds），
         题目一条不丢，只是默认折叠显示；需要时可在错题库"显示全部提交"展开。
         ------------------------------------------------------------------ */
      const uniqueByQuestion=new Map(),supersededCaseIds=new Map();
      for(const item of [...localById.values()].filter(m=>!(/示例错题/.test(String(m.question||''))||m.modelVersion==='local-geometry-demo'||m.source==='random'||m.randomization))){
        const key=canonicalMistakeKey(item),existing=uniqueByQuestion.get(key);
        if(!existing){uniqueByQuestion.set(key,item);continue}
        /* 两条都保留：优先级高的作为代表；被折叠的 id 记进 supersededCaseIds，
           用于把"指向旧记录"的焦点迁移到代表记录上（旧焦点不能悬空）。
           注意：不把另一条从 state.mistakes 里删掉 —— 用户不该看到题目变少。 */
        if(compareMistakeSyncPriority(item,existing)<0){
          uniqueByQuestion.set(key,item);
          supersededCaseIds.set(existing.id,item.id);
        }else{
          supersededCaseIds.set(item.id,existing.id);
        }
      }
      const resolveSupersededCaseId=caseId=>{let resolved=caseId,seen=new Set();while(resolved&&supersededCaseIds.has(resolved)&&!seen.has(resolved)){seen.add(resolved);resolved=supersededCaseIds.get(resolved)}return resolved};
      state.focusMistakeId=resolveSupersededCaseId(state.focusMistakeId);
      state.libraryDetailId=resolveSupersededCaseId(state.libraryDetailId);
      /* 展示列表仍然包含全部记录，只把同题代表排到前面，避免用户以为题目丢了。 */
      const representatives=[...uniqueByQuestion.values()];
      const representativeIds=new Set(representatives.map(item=>item.id));
      const collapsed=[...localById.values()].filter(item=>!representativeIds.has(item.id)
        && !(/示例错题/.test(String(item.question||''))||item.modelVersion==='local-geometry-demo'||item.source==='random'||item.randomization));
      state.mistakes=recoverIdenticalVerifiedModels([...representatives,...collapsed], Boolean(window.__eduAuthSessionToken)).sort(compareMistakeSyncPriority);
      state.__dedupedCount=collapsed.length;
      if(added||remote.length){refreshDecisionPlan();save();render()}
      queueLocalMistakeSync(250);
    }catch(error){window.__serverMistakesHydrated=false;window.__serverMistakeSyncError=String(error?.message||error);queueLocalMistakeSync(1500)}
  }

  function buildDiagnosticPlanTasks(){let existing=(state.plan&&state.plan.tasks)||[],today=dayStamp();return realMistakes().map(m=>{let d=diagnoseWeakness(m),p=profile(m),due=p.dueAt||today,priority=(due<=today?100:30)+(100-(p.mastery||40))+(p.lastResult==='需要继续修复'?30:0),taskId=`micro-${m.id}-${d.skill.id}`,previous=existing.find(t=>t.id===taskId&&t.scheduledFor===due),resource=resourceForDiagnosis(m,d);return{id:taskId,mistakeId:m.id,subject:m.subject,knowledgePoint:d.library.label,microSkill:d.weakness,diagnosis:d,scheduledFor:due,when:reviewTimeLabel(m),priority,done:Boolean(previous&&previous.done),recommendedResource:resource?{title:resource.title,locator:resource.locator}:null}}).sort((a,b)=>b.priority-a.priority)}

  function chemistryPlanHtml(session){let plan=session&&session.latestPlan;if(!plan)return'<div class="empty">输入化学题后，教练会先判断你卡在哪里，再决定是否需要 3D。</div>';let visual=plan.visualization||{},meta=chemModeMeta(visual.mode),path=plan.teachingPath||[],current=session.currentPhase;

    let q=document.querySelector('#chem-question'),student=document.querySelector('#chem-student');q.oninput=e=>{lab.question=e.target.value;save()};student.oninput=e=>{lab.studentMessage=e.target.value;save()};document.querySelectorAll('[data-chem-example]').forEach(button=>button.onclick=()=>{let[question,message]=button.dataset.chemExample.split('|');lab.question=question;lab.studentMessage=message;lab.session=null;lab.error='';render()});document.querySelector('#chem-start').onclick=startChemSession;document.querySelector('#chem-send')?.addEventListener('click',sendChemTurn);document.querySelector('#chem-followup')?.addEventListener('input',e=>{lab.studentMessage=e.target.value;save()});document.querySelector('#chem-save-mistake')?.addEventListener('click',saveChemMistake);mountChemistryIfNeeded()
  }

  document.querySelectorAll('.tabs button').forEach(button=>button.onclick=()=>{state.tab=button.dataset.tab;render()});

  async function analyzeSkill(kind,lab){
    let question=String(lab.question||'').trim();

    if(!question){lab.error='请先输入题目或选择图片';return render()}
    lab.status='loading';lab.error='';render();
    try{
      let assessed=null;
      const isImage=lab.mode==='image'&&Boolean(lab.imageDataUrl);

        assessed=await window.__eduRequest('/v1/chemistry/assess',{method:'POST',body:JSON.stringify({questionText:question})});

      let generated=await window.__eduRequest('/v1/skill-courses/generate',{method:'POST',body:JSON.stringify({kind,key})});

    }catch(error){lab.status='idle';lab.error=error.message;save();render()}

   ------------------------------------------------------------------
   背景：后端可信几何流水线现在只做“模型直出”，返回的模型标记为
   solverStatus="reference"（AI 参考模型）。旧挂载函数只接受
   "verified"，于是审核模式关掉之后，凡是走 AI 建模的题目都会在
   前端被静默拒绝，页面上什么也不显示 —— 这就是“一直生成不出 3D”的直接原因。
   另外参考模型的 scene.dimensions 是空数组，而挂载函数要求它非空。
   本层只做两件事：
     1) 让 reference 模型也能挂载（保留“未经严格校验”的提示，不冒充已验证）；
     2) 长度标注一律由该模型自己的坐标实时算出，保证“画多长 = 坐标里多长”。
   ------------------------------------------------------------------ */
/* 必须等第一个模块把挂载函数准备好：它有 top-level await，模块求值是异步的，
   直接同步执行会读到占位挂载函数并静默跳过整个增强层。
   这里同样不使用顶层 await（兼容老 WebView），改成依赖就绪后再接线。 */
function installGeometryEnhancements() {
(function () {
  // 只认增强层自己的标记：第一段脚本也会设置 __dshReferenceSupport，
  // 用它当守卫会让增强层（reference 挂载 + 小问切换条）永远装不上。
  if (window.__mountDeterministicThree && window.__mountDeterministicThree.__dshSubproblemSwitcher) return;
  const inner = window.__mountDeterministicThree;
  if (typeof inner !== 'function') return;

  /* ---------------------------------------------------------------
     "显示全部提交"开关
     错题库默认按题干去重：同一道题多次提交只显示优先级最高的一条，
     服务端记录一条都没删，但用户会以为题目被删掉了。
     这里把被合并的数量显示出来，并提供一键展开全部提交。
     state.__serverMistakes 由 hydration 阶段在合并前保存（见下方 hook）。
     --------------------------------------------------------------- */
  if (typeof state.showAllSubmissions !== 'boolean') state.showAllSubmissions = false;

  const baseRenderLibraryEnhancer = renderLibrary;
  renderLibrary = function (v) {
    baseRenderLibraryEnhancer(v);
    try {
      const toolbar = v.querySelector('.toolbar');
      if (!toolbar) return;
      const deduped = state.__libraryDedupedMistakes;
      // 第一次渲染错题库时记下去重后的列表，供"合并显示"还原。
      // 守卫必须用独立标记：用 deduped 判断会导致后面几轮渲染都以为"已记录"而跳过。
      if (!state.showAllSubmissions && !state.__libraryDedupRecorded) {
        state.__libraryDedupedMistakes = [...(state.mistakes || [])];
        state.__libraryDedupRecorded = true;
      }
      const remembered = state.__libraryDedupedMistakes;
      const hidden = remembered ? Math.max(0, (state.__serverMistakes || []).length - remembered.length) : 0;
      if (!state.showAllSubmissions && hidden > 0) {
        const note = document.createElement('p');
        note.className = 'muted library-dedup-note';
        note.textContent = `同一道题的重复提交已合并显示，另有 ${hidden} 条历史提交被折叠（服务端记录未删除）。`;
        toolbar.after(note);
      }
      const toggle = document.createElement('button');
      toggle.id = 'toggle-all-submissions';
      toggle.textContent = state.showAllSubmissions ? '合并显示' : `显示全部提交${hidden > 0 ? `（+${hidden}）` : ''}`;
      toggle.title = '默认把同一道题的多次提交合并为一条；切换后可看到每一次提交。';
      toggle.onclick = () => {
        state.showAllSubmissions = !state.showAllSubmissions;
        if (state.showAllSubmissions) {
          if (Array.isArray(state.__serverMistakes) && state.__serverMistakes.length) state.mistakes = [...state.__serverMistakes];
        } else if (state.__libraryDedupedMistakes) {
          state.mistakes = state.__libraryDedupedMistakes;
        }
        // 只走 save() + render()：refreshDecisionPlan 在模块作用域内，增强层取不到。
        save();
        render();
      };
      toolbar.insertBefore(toggle, toolbar.lastElementChild);
    } catch (error) { /* 增强失败不影响错题库本身 */ }
  };

  /* ---------------------------------------------------------------
     版本标记：浏览器缓存了旧页面时，用户看到的现象和新版本一模一样，
     很难分辨。这里在顶栏显示一个可点击的构建标记，明确当前加载的版本。
     --------------------------------------------------------------- */
  const BUILD_ID = '3D-v4-ref-switcher';
  try {
    const paintBuildStamp = () => {
      const host = document.querySelector('.top .stats');
      if (!host || host.querySelector('.build-stamp')) return;
      const stamp = document.createElement('span');
      stamp.className = 'tag build-stamp';
      const describe = () => (window.__THREE && window.__THREE.WebGLRenderer) ? `${BUILD_ID} · 3D 就绪` : `${BUILD_ID} · 3D 组件未加载`;
      stamp.textContent = describe();
      stamp.title = '看不到本标记或显示"3D 组件未加载"，说明浏览器在用缓存的旧页面：请按 Ctrl+Shift+R 强制刷新。';
      stamp.style.cursor = 'help';
      stamp.onclick = () => { stamp.textContent = describe(); };
      host.insertBefore(stamp, host.firstChild);
      if (window.__dshThreeReady && typeof window.__dshThreeReady.then === 'function') {
        window.__dshThreeReady.then(() => { stamp.textContent = describe(); }, () => { stamp.textContent = describe(); });
      }
    };
    // 脚本执行时 DOMContentLoaded 可能早已触发，所以两种情况都要覆盖。
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paintBuildStamp, {once: true});
    else paintBuildStamp();
  } catch (error) { /* 标记失败不影响主流程 */ }

  /* 兜底：服务端没连上时，绝不能少显示本地已有的题目。
     旧实现把去重后的列表存进 localStorage；一旦刷新时连不上服务端，
     用户看到的就是被折叠过的短列表 —— 直观感受就是"我上传的错题没了"。
     这里保留一份完整快照，hydrate 失败或拿不到服务端数据时用它。 */
  try {
    const rawSaved = safeStore.getItem(KEY);
    if (rawSaved) {
      const parsed = JSON.parse(rawSaved);
      if (Array.isArray(parsed?.rawMistakes) && parsed.rawMistakes.length) {
        state.__rawMistakesSnapshot = parsed.rawMistakes;
      }
    }
  } catch (error) { /* 快照读取失败不影响主流程 */ }

  const restoreLocalSnapshot = () => {
    if (window.__serverMistakesHydrated) return false;
    const snapshot = state.__rawMistakesSnapshot;
    if (!Array.isArray(snapshot) || !snapshot.length) return false;
    const known = new Set((state.mistakes || []).map(item => item.id));
    const missing = snapshot.filter(item => item && item.id && !known.has(item.id));
    if (!missing.length) return false;
    state.mistakes = [...(state.mistakes || []), ...missing];
    return true;
  };

  /* ------------------------------------------------------------------
     数据自检条：让"有没有丢题"变成可核对的事实
     错题库默认按题干折叠显示，条数少于实际提交数，
     用户很容易误以为"我录入的错题没了"。
     这里明确写出：显示的题目数 / 实际提交数 / 被折叠的重复提交数。
     ------------------------------------------------------------------ */
  function paintDataAuditBar() {
    const host = document.querySelector('.top .stats');
    if (!host) return;
    let bar = host.querySelector('.data-audit');
    if (!bar) {
      bar = document.createElement('span');
      bar.className = 'tag data-audit';
      bar.style.cursor = 'help';
      host.insertBefore(bar, host.firstChild);
    }
    const shown = (state.mistakes || []).length;
    const total = Array.isArray(state.__serverMistakes) && state.__serverMistakes.length
      ? state.__serverMistakes.length
      : shown;
    const collapsed = Math.max(0, total - shown);
    const serverOk = Boolean(window.__serverMistakesHydrated);
    bar.textContent = `题目 ${shown} 条` + (collapsed > 0 ? `（同题重复 ${collapsed} 条已折叠，未删除）` : '')
      + (window.__serverMistakeSyncError ? ' · 云端同步待重试' : '');
    bar.title = `当前列表 ${shown} 条；服务端共 ${total} 条。`
      + (serverOk ? '已连上学习服务。' : '未连上学习服务，当前显示本地存档。')
      + (window.__serverMistakeSyncError ? `最近同步失败：${window.__serverMistakeSyncError}` : '')
      + (collapsed > 0 ? '同一道题的多次提交默认折叠为一条，数据都在，可在错题库点「显示全部提交」展开。' : '');
  }

  /* ---------------------------------------------------------------
     自动挂载可旋转 3D
     旧逻辑只在"错题库"页绑定（bindLibrary）时才尝试挂载，
     而新提交的模型是在"上传"页完成的 —— 结果面板里只剩静态示意图，
     必须手动点一下"启用可旋转 3D 模型"才会变成画布。
     这里在每次渲染后自动挂载：只要详情里的题目有可用模型就立刻转成画布，
     标注工具（画笔/橡皮/标记）随画布一起出现在同一个面板。
     --------------------------------------------------------------- */
  /* 占位面板 → 真面板：后台建模完成后，"正在生成中"的那块要自己变成可旋转模型。
     建模失败时**不再把占位面板改写成大说明卡**（太占面积，而且数学以外的科目根本不需要 3D）：
     直接把占位面板收掉，失败原因留在错题卡片的状态标记悬停提示里，
     「重新生成 3D 模型」按钮本来就在卡片的操作栏里。 */
  function fillPendingThreePlaceholders() {
    document.querySelectorAll('[data-me-3d-building]').forEach(placeholder => {
      const caseId = placeholder.dataset.me3dBuilding;
      const mistake = (state.mistakes || []).find(item => item.id === caseId);
      if (!mistake) return;
      const ready = Boolean(mistake.geometryResult && mistake.geometryResult.scene);
      if (ready && !placeholder.dataset.me3dRefill) {
        // 标一下再重渲染，避免同一帧里反复触发；下一次渲染会生成真正的 [data-case-three] 面板
        placeholder.dataset.me3dRefill = '1';
        setTimeout(() => render(), 0);
        return;
      }
      // 失败或本来就不需要：收掉占位面板，别再插任何提示卡
      if (!ready && (mistake.geometryBuildStatus === 'failed' || !mistake.geometryBuildStatus)) {
        placeholder.remove();
      }
    });
  }
  function autoMountGeometryStages() {
    fillPendingThreePlaceholders();
    if (typeof window.__mountDeterministicThree !== 'function') return;
    document.querySelectorAll('[data-case-three]').forEach(stage => {
      if (stage.querySelector('canvas') || stage.__geometryController) return;
      const mistake = (state.mistakes || []).find(item => item.id === stage.dataset.caseThree);
      if (!mistake || !mistake.geometryResult || !mistake.geometryResult.scene) return;
      let ok = false;
      try { ok = window.__mountDeterministicThree(stage, mistake.geometryResult); } catch (error) { ok = false; }
      if (ok) {
        const button = stage.closest('.geometry-scene')?.querySelector('[data-load-three]');
        if (button) button.remove();          // 已经自动加载，去掉多余的手动按钮
      }
    });
  }
  // 渲染后调度一次（等 DOM 落地再挂载）
  const baseRenderForAutoMount = render;
  render = function () {
    window.__eduClearStepOnModel?.();
    // 先补齐本地快照里被漏掉的题目，再渲染（服务端不可用时尤其重要）
    try { restoreLocalSnapshot(); } catch (error) { /* 兜底失败不影响正常渲染 */ }
    const output = baseRenderForAutoMount.apply(this, arguments);
    setTimeout(autoMountGeometryStages, 0);
    setTimeout(paintDataAuditBar, 0);
    return output;
  };
  // 3D 依赖迟到时也要补挂载一次
  if (window.__dshThreeReady && typeof window.__dshThreeReady.then === 'function') {
    window.__dshThreeReady.then(() => setTimeout(autoMountGeometryStages, 0), () => {});
  }

  /* ---------------------------------------------------------------
     答案默认不显示：必须先在 AI 陪练里一步步推
     ---------------------------------------------------------------
     产品要求：不许"一键给答案"。学生要先在陪练里推进得分点，
     推到一定程度后才允许"对照答案"；而且对照是明确的主动动作，
     不是页面一打开就把结论摊在眼前。
     进度门槛：
       - 完成全部得分点    → 直接解锁
       - 推进过半（≥50%）  → 可以点"对照答案"
       - 还没开始/推进不足 → 只显示提示，点都不给点
     --------------------------------------------------------------- */
  const ANSWER_UNLOCK_PERCENT = 50;

  /* 把得分点进度暴露出来：答案门禁依赖它，出问题时能直接查 */
  try {
    window.__eduScoreProgress = m => {
      try { return Number(scoreProgress(m)?.percent) || 0; } catch (error) { return 0; }
    };
    window.__eduScoreProgressFull = m => {
      try { return scoreProgress(m) || null; } catch (error) { return null; }
    };
  } catch (error) { /* 暴露失败不影响主流程 */ }

  /* HTML 转义：答案、选项文本都要经过它，避免题目里的符号破坏结构 */
  const escText = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch]));

  /* 进度从多来源取，按可靠度依次降级。
     不直接依赖 scoreProgress() 的内部分支：它同时服务条状进度条，
     分支较多；门禁只需要一个可信的百分比。 */
  function tutorProgressPercent(m) {
    const key = (() => {
      try { return tutorSessionKey(m, activeSubproblem(m)); } catch (error) { return m && m.id; }
    })();
    const session = (state.tutorSessions || {})[key] || (state.tutorSessions || {})[m && m.id] || {};
    const server = session.learningState && session.learningState.scoreProgress;
    if (server) {
      // 服务端同时给出 parts 与 completedPartIds：以它为准重算
      const parts = Array.isArray(server.parts) ? server.parts : [];
      const done = Array.isArray(server.completedPartIds) ? server.completedPartIds : [];
      if (parts.length) return Math.max(0, Math.min(100, Math.round(done.length / parts.length * 100)));
      const direct = Number(server.percent);
      if (Number.isFinite(direct)) return Math.max(0, Math.min(100, direct));
    }
    if (m && m.tutorLearningState && m.tutorLearningState.scoreProgress) {
      const direct = Number(m.tutorLearningState.scoreProgress.percent);
      if (Number.isFinite(direct)) return Math.max(0, Math.min(100, direct));
    }
    // 最后退回本页已有的得分点进度条实现
    try {
      const percent = Number(scoreProgress(m)?.percent);
      if (Number.isFinite(percent)) return Math.max(0, Math.min(100, percent));
    } catch (error) { /* 拿不到就按 0，答案保持锁定 */ }
    return 0;
  }

  function answerRevealKey(m) {
    return 'answer-revealed:' + (m && m.id || '');
  }

  function answerBlockHtml(m) {
    const answer = String(m && m.correctAnswer || '').trim();
    if (!answer) return '';
    const percent = tutorProgressPercent(m);
    /* —— 答案门禁 ——
       规则（用户定的）：学生必须**先说自己的答案**，再满足下面任一条件才看得到答案：
         · 陪练得分点进度到 50%，或已经主动求助过
         · 这道题之前完整走过一次闭环（得分点 100%、有复盘）
       最后那条就是「之前完整解决过一次闭环，之后一键查看正确答案」。
       没作答的题（或只有占位串）永远保持锁定，要先手动填一次或声明当时空着。 */
    const PLACEHOLDER_ANSWERS = ['待补充学生作答过程', '待开始真实作答', '待补充作答过程', '待补充'];
    const rawStudentAnswer = String(m && m.studentAnswer || '').trim();
    const hasOwnAnswer = Boolean(rawStudentAnswer) && !PLACEHOLDER_ANSWERS.includes(rawStudentAnswer);
    // 之前闭环走完过 → 之后一键查看，不再要求重新推一遍
    const completedLoop = Boolean(m && m.completionReview)
      || Number(m && m.tutorLearningState && m.tutorLearningState.scoreProgress && m.tutorLearningState.scoreProgress.percent) === 100;
    const progressUnlocked = percent >= ANSWER_UNLOCK_PERCENT;
    const unlocked = hasOwnAnswer && (completedLoop || progressUnlocked);
    const alreadyRevealed = Boolean(state[answerRevealKey(m)]);

    const notice = String(m && m.answerNotice || '').trim();
    const queries = Array.isArray(m && m.queryAnswers) ? m.queryAnswers : [];

    // 没写下过自己的答案：先要答案，连进度都不提 —— 这一步不能跳过
    if (!hasOwnAnswer) {
      return `<section class="answer-block answer-locked"><div class="head"><b>答案已锁定</b><span class="pill warn">先说你的答案</span></div>`
        + `<p class="muted">对照答案之前，请先写下你自己当时的答案（写错也算）。`
        + `只有你先说出来，后面的对照才有意义 —— 否则看答案就变成了抄答案。</p>`
        + `<button data-answer-claim="${esc(m && m.id || '')}">写下我当时的答案</button></section>`;
    }

    // 未解锁：只说明还差什么，不透露任何结论
    if (!unlocked) {
      const need = Math.max(0, ANSWER_UNLOCK_PERCENT - Math.round(percent));
      return `<section class="answer-block answer-locked"><div class="head"><b>答案已锁定</b><span class="pill warn">先陪练</span></div>`
        + `<p class="muted">这道题的结论不会直接给出。请先用「AI 陪我拆解」一步一步推：`
        + `把每一步的想法写进去，让陪练确认你想对了再往下走。</p>`
        + `<p class="muted">当前得分点进度 <b>${Math.round(percent)}%</b>，再推进约 <b>${need}%</b> 才能对照答案。</p>`
        + `</section>`;
    }

    // 已解锁：仍需主动点一次才展开（避免"打开就是答案"）
    const rows = queries.length
      ? queries.map(item => `<li>${escText(item.text || item.answer || '')}</li>`).join('')
      : '';
    const body = rows ? `<ul class="answer-parts">${rows}</ul>` : `<p class="math exact-answer">${escText(answer)}</p>`;
    const detail = alreadyRevealed
      ? `${body}${notice ? `<p class="muted">${escText(notice)}</p>` : ''}`
      : '';
    const button = alreadyRevealed
      ? `<button type="button" class="answer-hide" data-answer-hide="${escText(m.id)}">收起答案，继续自己推</button>`
      : `<button type="button" class="primary answer-reveal" data-answer-reveal="${escText(m.id)}">我推完了，对照答案</button>`;
    return `<section class="answer-block ${notice ? 'is-reference' : ''} ${alreadyRevealed ? '' : 'answer-gated'}">`
      + `<div class="head"><b>${alreadyRevealed ? (notice ? 'AI 参考结果' : '标准答案') : '已可对照答案'}</b>`
      + `<span class="pill ${alreadyRevealed ? (notice ? 'warn' : 'good') : 'good'}">得分点 ${Math.round(percent)}%</span></div>`
      + `${detail}${button}</section>`;
  }

  const baseMistakeHtml = mistakeHtml;
  mistakeHtml = function (m) {
    const html = baseMistakeHtml(m);
    const block = answerBlockHtml(m);
    if (!block) return html;
    return html.replace('</article>', block + '</article>');
  };

  /* 展开/收起答案：写进 state 并重渲染，避免"一键出答案"的默认行为 */
  const baseBindForAnswerGate = bindLibrary;
  bindLibrary = function () {
    baseBindForAnswerGate();
    document.querySelectorAll('[data-answer-reveal]').forEach(button => {
      button.onclick = () => {
        state[answerRevealKey({id: button.dataset.answerReveal})] = true;
        save(); render();
      };
    });
    document.querySelectorAll('[data-answer-hide]').forEach(button => {
      button.onclick = () => {
        state[answerRevealKey({id: button.dataset.answerHide})] = false;
        save(); render();
      };
    });
    /* 「写下我当时的答案」：答案门禁的第一道关。
       直接复用错题库已有的「我的作答」输入框（data-me="studentAnswer"），
       不另造一套界面，省得以后两处要同步。 */
    document.querySelectorAll('[data-answer-claim]').forEach(button => {
      button.onclick = () => {
        const id = button.dataset.answerClaim;
        if (!id || !(state.mistakes || []).some(item => item.id === id)) return;
        state.focusMistakeId = id;
        state.libraryDetailId = id;
        save(); render();
        setTimeout(() => {
          const field = document.querySelector('[data-me="studentAnswer"]');
          if (field) { field.focus(); field.scrollIntoView({block: 'center', behavior: 'smooth'}); }
        }, 80);
      };
    });
  };

  /* ---------------------------------------------------------------
     小问选择器驱动 3D 模型
     后端已经为每个小问算好了要突出的点线面（scene.pedagogy.subproblemViews），
     渲染器也早就暴露了 highlight()，但从来没有人调用 —— 所以切小问时图一动不动。
     这里把小问和 3D 视图连起来：切到第（2）问，就把该问用到的点线面高亮、其余淡出。
     --------------------------------------------------------------- */
  function sceneViewElementsFor(stage) {
    return [...stage.querySelectorAll('[data-subproblem-view]')];
  }

  // 前端小问按 第（1）问、第（2）问… 编号；后端视图按同一次编译的 queries 顺序对齐。
  function subproblemIndex(id) {
    const digits = String(id || '').replace(/\D/g, '');
    const parsed = Number(digits);
    return Number.isFinite(parsed) && parsed > 0 ? parsed - 1 : 0;
  }

  function viewsForResult(result) {
    const views = result && result.scene && result.scene.pedagogy && result.scene.pedagogy.subproblemViews;
    return Array.isArray(views) ? views : [];
  }

  /* 渲染器自带的 highlight() 只把非当前对象淡到 0.22，对本来就半透明的面几乎看不出差别。
     这里额外调用控制器精确的 dimExcept()，把非当前小问的对象压到很淡。 */
  function preferSubproblemFocus(stage, activeRefs) {
    const controller = stage && stage.__geometryController;
    if (!controller || typeof controller.dimExcept !== 'function') return;
    controller.dimExcept(activeRefs || []);
  }

  function applySubproblemView(stage, result, subproblemId) {
    const controller = stage && stage.__geometryController;
    if (!controller || !controller.highlight) return false;
    const views = viewsForResult(result);
    if (!views.length) return false;
    const index = Math.min(subproblemIndex(subproblemId), views.length - 1);
    const view = views[index];
    const refs = Array.isArray(view && view.highlightEntities) ? view.highlightEntities : [];
    // 高亮该小问用到的对象；其余由渲染器统一淡出，再由本层压得更淡。
    controller.highlight(refs);
    preferSubproblemFocus(stage, refs);
    stage.querySelectorAll('[data-subproblem-view]').forEach(button => {
      const active = subproblemIndex(button.dataset.subproblemView) === index;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    const label = stage.querySelector('[data-subproblem-active-label]');
    if (label) label.textContent = view && view.label ? String(view.label) : '';
    return true;
  }

  /* 在一个已挂载的 3D 面板顶部插入小问切换条。 */
  function attachSubproblemSwitcher(stage, result, m) {
    const views = viewsForResult(result);
    if (!views.length) return;
    stage.querySelectorAll('.subproblem-switch').forEach(node => node.remove());
    const bar = document.createElement('div');
    bar.className = 'subproblem-switch';
    bar.setAttribute('role', 'group');
    bar.setAttribute('aria-label', '选择小问，只看该问用到的图形');
    bar.innerHTML = `<span class="sw-label">小问</span>`
      + views.map((view, index) => `<button type="button" data-subproblem-view="${escText(view.id || index + 1)}" aria-pressed="false" title="${escText(view.label || '')}">第（${index + 1}）问</button>`).join('')
      + `<button type="button" data-subproblem-view-all class="sw-all">看全图</button>`
      + `<span class="sw-active" data-subproblem-active-label></span>`;

    bar.querySelectorAll('[data-subproblem-view]').forEach(button => {
      button.onclick = () => {
        const index = subproblemIndex(button.dataset.subproblemView);
        if (m) { state.activeSubproblems[m.id] = `q${index + 1}`; save(); }
        applySubproblemView(stage, result, `q${index + 1}`);
      };
    });
    const all = bar.querySelector('[data-subproblem-view-all]');
    if (all) all.onclick = () => {
      const controller = stage.__geometryController;
      if (controller && controller.highlight) controller.highlight([]);
      if (controller && controller.restoreOpacity) controller.restoreOpacity();
      bar.querySelectorAll('[data-subproblem-view]').forEach(button => { button.classList.remove('active'); button.setAttribute('aria-pressed', 'false'); });
      const label = bar.querySelector('[data-subproblem-active-label]');
      if (label) label.textContent = '';
    };

    stage.insertBefore(bar, stage.firstChild);
    stage.classList.add('has-subproblem-switch');
    /* 有意不在挂载时自动套用某个小问的高亮：
       学生第一次看到的必须是完整图形，只有他主动点某一个小问才聚焦，
       避免"打开就少了一半图形"这种误导。 */
  }

  window.__attachGeometrySubproblemSwitcher = attachSubproblemSwitcher;

  /* 小问选择器（AI 陪练里的 chip）被点击时，同步更新页面上的 3D 模型。
     原实现点击后整体重渲染，而重渲染会经 three-ready 重新挂载并清掉高亮，
     所以在 render() 之后立刻把高亮重新贴回去。 */
  const syncSubproblemToScene = button => {
    const subproblemId = String(button.dataset.subproblemSelect || '').split('::')[1] || '';
    queueMicrotask(() => {
      // 只更新当前正在显示的那一个 3D 面板，绝不批量挂载错题库里的其它场景。
      const stages = document.querySelectorAll('[data-case-three]');
      const update = stage => {
        const m = state.mistakes.find(item => item.id === stage.dataset.caseThree);
        if (m) applySubproblemView(stage, m.geometryResult, subproblemId);
      };
      Array.prototype.forEach.call(stages, update);
      document.querySelectorAll('[data-subproblem-view]').forEach(sceneButton => {
        const active = sceneButton.dataset.subproblemView === subproblemId;
        sceneButton.classList.toggle('active', active);
        sceneButton.setAttribute('aria-pressed', String(active));
      });
    });
  };

  const baseBindTutor = bindTutor;
  bindTutor = function () {
    baseBindTutor();
    document.querySelectorAll('[data-subproblem-select]').forEach(button => {
      const previous = button.onclick;
      button.onclick = event => {
        if (typeof previous === 'function') previous.call(button, event);
        syncSubproblemToScene(button);
      };
    });
  };

  // 挂载入口在文件末尾统一注册（实现函数 mountGeometryModel 定义在下面）。

  // 与 3D 渲染完全一致的换算：后端用数学右手系 z 轴向上，
  // three.js 里 y 轴向上，所以 (x, y, z)_数学 -> (x, z, y)_three。
  const mathVec = p => [Number(p[0]), Number(p[2]), Number(p[1])];
  const distance = (a, b) => {
    const u = mathVec(a), v = mathVec(b);
    return Math.hypot(u[0] - v[0], u[1] - v[1], u[2] - v[2]);
  };
  const showNumber = value => {
    const rounded = Number(value.toFixed(4));
    return String(rounded);
  };

  /* 坐标有两种来源：确定性求解器给的是精确表达式节点 {op:"rational",...}，
     可信流水线直出的 AI 模型给的是普通数字。内部渲染函数只会解析表达式节点，
     直接喂数字会得到 NaN（点全部塌掉、画布空白）。这里统一成表达式节点。 */
  function toExpressionNode(value) {
    if (typeof value === 'number') {
      return Number.isInteger(value)
        ? {op: 'integer', value}
        : {op: 'rational', p: value, q: 1};
    }
    return value;
  }
  function normalizeCoordinates(coordinates) {
    const normalized = {};
    for (const [name, point] of Object.entries(coordinates || {})) {
      if (!Array.isArray(point) || point.length !== 3) return null;
      normalized[name] = point.map(toExpressionNode);
    }
    return Object.keys(normalized).length ? normalized : null;
  }

  /* 只给“真实棱”加标注：过滤掉对角线，避免参考模型标出一堆斜边。
     边集合本身来自题目 IR，取前若干条足够学生看清比例关系。 */
  function deriveDimensions(scene, coordinates) {
    const edges = Array.isArray(scene.frameEdges) ? scene.frameEdges : [];
    const seen = new Set();
    const dimensions = [];
    for (const edge of edges) {
      if (!Array.isArray(edge) || edge.length !== 2) continue;
      const [from, to] = edge;
      if (!coordinates[from] || !coordinates[to]) continue;
      const key = [from, to].sort().join('|');
      if (seen.has(key)) continue;
      seen.add(key);
      const value = distance(coordinates[from], coordinates[to]);
      if (!(value > 0)) continue;
      dimensions.push({
        id: `derived-${key}`,
        label: `${from}${to} = ${showNumber(value)}`,
        points: [from, to],
        value,
        valueSource: 'modelCoordinates'
      });
      if (dimensions.length >= 6) break;
    }
    return dimensions;
  }

  function mountGeometryModel(container, result) {
    if (!container || !result) return false;
    const solverStatus = result.solverStatus;
    // 旧错题可能已保存完整场景与坐标，却没有 solverStatus；仅作为参考图恢复，绝不冒充 verified。
    const isReference = solverStatus === 'reference' || (!solverStatus && Boolean(result.scene));

    // 旧行为的唯一入口条件：只认 verified。这里把 reference 也放进来。
    if (solverStatus !== 'verified' && !isReference) return false;
    const coordinates = result.canonicalCoordinates || result.finalCoordinates || result.candidateCoordinates;
    if (!result.scene || !coordinates) return false;

    // 参考模型的尺寸标注是空的，补一套完全由坐标算出的长度，单位与网格一致。
    let scene = result.scene;
    if (isReference && !(Array.isArray(scene.dimensions) && scene.dimensions.length)) {
      const dimensions = deriveDimensions(scene, coordinates);
      if (dimensions.length) scene = {...scene, dimensions};
    }

    /* 内部渲染函数自带两道只认 verified / canonicalCoordinates 的守卫。
       这里给它一个“兼容视图”：渲染期间对外报 verified 并交出表达式节点坐标，
       result 本身仍然保留 solverStatus="reference" 的真实状态，
       页面上的徽标和文案由本层按真实状态渲染，绝不冒充已严格校验。 */
    const expressionCoordinates = normalizeCoordinates(coordinates);
    if (!expressionCoordinates) return false;
    const renderView = isReference
      ? {
          ...result,
          scene,
          get solverStatus() { return 'verified'; },
          get canonicalCoordinates() { return expressionCoordinates; }
        }
      : {...result, scene, canonicalCoordinates: expressionCoordinates};
    if (isReference) {
      renderView.scene = {...scene, grid: {...scene.grid, valueSource: 'canonicalCoordinates'}};
    }
    /* 内部渲染器自己的 number() 只认 {op:...} 表达式节点，而可信流水线直出的是普通数字。
       把归一化后的坐标一并透传，供手绘拾取与几何计算使用；
       否则那边会把坐标算成 NaN，导致射线打不中任何平面（表现为"点了没反应"）。 */
    renderView.__normalizedCoordinates = expressionCoordinates;

    const mounted = inner(container, renderView);
    if (!mounted) return false;
    // 明确告诉学生这个模型的可靠等级，不让参考模型看起来像已严格验证的模型。
    const head = container.parentElement && container.parentElement.querySelector('.head');
    if (head && !head.querySelector('.geometry-trust-pill')) {
      const pill = document.createElement('span');
      pill.className = `pill geometry-trust-pill ${isReference ? 'warn' : 'good'}`;
      pill.textContent = isReference ? 'AI 参考模型 · 可旋转' : '双重校验通过';
      pill.title = isReference
        ? '坐标由 AI 按题意给出，长度标注直接由这些坐标算出；未验证的量不作为最终答案依据。'
        : '坐标、约束与长度标注来自同一份已验证结构化结果。';
      head.appendChild(pill);
    }

    const note = container.querySelector('.unit-grid-note');
    if (note) {
      const unit = scene.grid && scene.grid.unit;
      note.textContent = isReference
        ? `每小格 = ${unit} 个长度单位（模型按坐标 1:1 绘制，长度标注由坐标实时算出）`
        : `每小格 = ${unit} 个长度单位`;
    }
    return true;
  }

  /* 对外入口：先按上面的规则挂载模型，再补上小问切换条。
     切换条属于增强功能，它出错绝不能让已经画好的模型消失。 */
  window.__mountDeterministicThree = function (container, result) {
    const ok = mountGeometryModel(container, result);
    if (!ok) return ok;
    try {
      const m = state.mistakes.find(item => item.id === (container.dataset.caseThree || ''));
      attachSubproblemSwitcher(container, result, m || null);
    } catch { /* 忽略切换条自身的失败 */ }
    return ok;
  };
  window.__mountDeterministicThree.__dshReferenceSupport = true;
  window.__mountDeterministicThree.__dshSubproblemSwitcher = true;
})();
} /* end installGeometryEnhancements */

/* 依赖就绪后再安装增强层。加载失败也要安装：答案展示与陪练等非 3D 增强不依赖 three.js。 */
const installWhenReady = () => {
  try { installGeometryEnhancements(); } catch (error) {
    // 不能静默吞掉：增强层装不上时必须能在控制台直接看到原因
    try { console.error('[geometry-enhance] 增强层安装失败：', error); } catch (inner) {}
    window.__dshEnhanceError = String(error && (error.stack || error.message || error));
  }
};
if (window.__dshThreeReady && typeof window.__dshThreeReady.then === 'function') {
  window.__dshThreeReady.then(installWhenReady, installWhenReady);
} else {
  installWhenReady();
}
</script>

<script>
/* 到这里所有扩展脚本都已同步执行完毕（index.html 末尾、无 defer/async），
   可以让界面显示了；再用一个短超时兜底，避免任何脚本异常导致页面一直空白。 */
(function () {
  var show = function () { document.body.classList.add('app-ready'); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, {once: true});
  else show();
  setTimeout(show, 1500);
})();
</script>
